name: CI — Intégration Continue

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 2ème Voie DevOps : Feedback rapide sur chaque push/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # JOB 1 : Qualité du code (lint + typecheck)
  # ──────────────────────────────────────────
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Linter ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

  # ──────────────────────────────────────────
  # JOB 1bis : Sécurité (CVE + secrets)
  # KLB-09 : la CI ne comportait aucune étape de sécurité.
  # ──────────────────────────────────────────
  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks a besoin de l'historique complet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      # Bloque sur toute CVE haute/critique non explicitement acceptée.
      # Les exceptions vivent dans le script, avec justification et date de
      # réexamen — une exception périmée fait échouer la CI à son tour.
      - name: Audit des dépendances
        run: python3 scripts/check-dependencies.py

      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Refuse toute policy RLS qui ne serait pas restreinte à `authenticated`.
      # Une instruction CREATE POLICY s'étend sur plusieurs lignes : on la lit
      # jusqu'à son `;` avant de chercher la clause TO.
      - name: Vérifier le cadrage des policies RLS
        run: python3 scripts/check-rls-policies.py

  # ──────────────────────────────────────────
  # JOB 2 : Tests automatisés
  # ──────────────────────────────────────────
  tests:
    name: Tests automatisés
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm run test:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────
  # JOB 3 : Build de production
  # ──────────────────────────────────────────
  build:
    name: Build production
    runs-on: ubuntu-latest
    needs: [quality, security, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
